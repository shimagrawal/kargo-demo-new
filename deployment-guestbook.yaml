apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    stage: prod
  name: guestbook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
        release: 2026.11.7
    spec:
      containers:
      - image: ghcr.io/akuity/guestbook@sha256:faae7216af7e9b22e5a1f7961d9c3d89a4206727363b06f6eeb9622b00f7dc19
        name: guestbook
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
