apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-demo
  labels:
    kargo.akuity.io/shard: self-hosted
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: self-hosted
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      # Security gate: block images with fixable CRITICAL vulnerabilities not accepted in app/.trivyignore.
      - task:
          name: scan
      - task:
          name: deploy
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-demo
  labels:
    kargo.akuity.io/shard: self-hosted-uat
  annotations:
    kargo.akuity.io/color: amber
spec:
  shard: self-hosted-uat
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: scan
      - task:
          name: deploy
  # A failed smoke test triggers the auto-rollback configured in the ProjectConfig.
  verification:
    analysisTemplates:
    - name: smoke-test
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-demo
  labels:
    kargo.akuity.io/shard: self-hosted-prod
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: self-hosted-prod
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      # Scan before asking for approval, so approvers only see releases that passed the gate.
      - task:
          name: scan
      # Separation of duties: a release manager has to approve every prod promotion.
      - uses: wait-for-approval
        as: approve
        config:
          minApprovals: 1
          approvers:
          - claim: email
            value: shivam.agrawal@akuity.io
            required: true
      - uses: record-audit-event
        config:
          type: approved
          actor: ${{ outputs['approve'].responses[0].user }}
          message: Release ${{ ctx.targetFreight.name }} approved for ${{ ctx.stage }}
          data:
            freight: ${{ ctx.targetFreight.name }}
            approval: ${{ outputs['approve'].responses[0].message ?? "" }}
      - task:
          name: deploy
      - uses: record-audit-event
        config:
          type: deployed
          message: Release ${{ ctx.targetFreight.name }} deployed to ${{ ctx.stage }}
          data:
            freight: ${{ ctx.targetFreight.name }}
