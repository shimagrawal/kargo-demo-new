apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargo-demo
  annotations:
    # Kargo creates the project namespace, which the other resources need, so sync the Project first.
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-demo
  namespace: kargo-demo
spec:
  promotionPolicies:
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
  # When staging's verification fails, promote the last verified Freight again.
  - stageSelector:
      name: staging
    autoRollback:
      onVerification:
      - Failed
  promotionWindows:
  # Change freeze for prod. Off by default; set disabled: false during the demo to show prod being blocked.
  - name: change-freeze
    description: Year-end change freeze for production
    disabled: false
    kind: Deny
    stageSelector:
      name: prod
    dtstart: "20261101T000000Z"
    dtend: "20270101T000000Z"
