apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
        release: "2026.11.6"
    spec:
      containers:
      - name: guestbook
        image: ghcr.io/akuity/guestbook
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
